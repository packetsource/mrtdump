[package]
name = "mrtdump"
version = "0.1.1"
edition = "2021"

[dependencies]
byteorder = "1.5.0"
bzip2 = "0.4.4"
anyhow = "1.0.86"
time = { version = "0.3.36", features = ["formatting", "parsing"] }
lazy_static = "1.5.0"
reqwest = { version = "0.13", features = ["blocking"] }
url = "2.5.3"
bytes = "1.8.0"
flate2 = { git = "https://github.com/rust-lang/flate2-rs" }
serde = {  version = "1.0.215", features = ["derive"] }
uuid = { version = "1.11.0", features = ["v4"] }
serde_json = "1.0.133"
tokio = { version = "1", features = ["full"] }
russh = "0.60"
rand = "0.10"
